[package]
name = "masterblaster-tauri-shell"
version = "2.0.0-grokier"
description = "MasterBlaster Tauri shell"
authors = ["MasterBlaster Grokier Forge"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "masterblaster_tauri_shell_lib"
crate-type = ["lib", "cdylib", "staticlib"]