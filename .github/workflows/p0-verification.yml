name: P0 Verification

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import package and Qt bindings
        run: |
          python -c "import masterblaster_control; import masterblaster_control.main_window; from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt import smoke ok')"

      - name: Run deterministic P0 proof battery
        run: |
          python -m pytest
          python -m compileall masterblaster_control scripts
          python scripts/validate_p0_registry.py
          python scripts/demo_p0_overdrive.py
          python scripts/generate_sbom.py --check
          python scripts/validate_governance.py
          python scripts/scan_prohibited_capabilities.py

      - name: Upload SBOM artifact
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterblaster-p0-sbom-${{ matrix.os }}-py${{ matrix.python-version }}
          path: sbom/masterblaster-p0.spdx.json
          if-no-files-found: error
