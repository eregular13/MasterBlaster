name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Check deterministic local SBOM fallback
        run: |
          python scripts/generate_sbom.py --check

      - name: GitHub dependency graph review
        id: dependency-review
        continue-on-error: true
        # actions/dependency-review-action v5.0.0
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

      - name: Report GitHub dependency review availability
        if: steps.dependency-review.outcome != 'success'
        run: |
          echo "::warning::GitHub dependency review did not complete. The deterministic SBOM check passed, but maintainers must enable Dependency graph/GitHub dependency review support before treating this workflow as remote vulnerability enforcement."
