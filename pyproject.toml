[build-system]
requires = ["setuptools==70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "masterblaster-control"
version = "1.2.1"
description = "MasterBlaster — professional security assessment control plane for consulting firms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.7.0",
    "reportlab==4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
]
