[build-system]
requires = ["setuptools==70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "masterblaster-control"
version = "1.0.0"
description = "MasterBlaster v1.0 authorized security assessment control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
]
